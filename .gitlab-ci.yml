variables:
      GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/oasis3-mct

tests_toys_oasis_tioman:
     tags:
     - sshcoquartci.spike
     only:        
     - master
               
     script:
     - ssh tioman "rm -rf /space/coquart/OA3_MCT_RES ; mkdir /space/coquart/OA3_MCT_RES"
     - ssh tioman "rm -rf /scratch/globc/coquart/oasis3-mct"
     - ssh tioman "cd /scratch/globc/coquart; git clone git@nitrox.cerfacs.fr:globc/OASIS3-MCT/oasis3-mct.git"
     - ssh tioman "cd /scratch/globc/coquart/oasis3-mct/util/nitrox;./sc_lc_nitrox.sh tioman_intel21.1.1_intelmpi2021.1.1 DEBUGT"
     - ssh tioman "rm -rf $CI_PROJECT_DIR"

