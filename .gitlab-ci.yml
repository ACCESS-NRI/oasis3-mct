variables:
      GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/oasis3-mct

tests_toys_oasis_tioman:
     tags:
     - sshcoquartci.spike
     only:        
     - new_header_Makefiles_final
               
     script:
     - ssh tioman "rm -rf /space/coquart/OA3_MCT_RES ; mkdir /space/coquart/OA3_MCT_RES"
     - ssh tioman "cd $CI_PROJECT_DIR/util/nitrox;./sc_lc_nitrox.sh tioman_intel21.1.1_intelmpi2021.1.1 DEBUGT $CI_PROJECT_DIR"

