variables:
      GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/oasis3-mct

tests_toys_oasis_fundy:
     tags:
     - sshjonvilleci.spike
     only:
     - master

     script:
     - ssh fundy "\rm -rf ${SCRATCHDIR}/oasis3-mct ${SCRATCHDIR}/OA3-MCT_RES ; mkdir ${SCRATCHDIR}/OA3-MCT_RES"
     - ssh fundy "cd ${SCRATCHDIR} ; git clone --branch master --recurse-submodules git@nitrox.cerfacs.fr:globc/OASIS3-MCT/oasis3-mct.git ; cd oasis3-mct ; git submodule update --init --remote"
     - ssh fundy "cd ${SCRATCHDIR}/oasis3-mct/util/nitrox ; ./sc_lc_nitrox.sh fundy_gfortran10.2.0_openmpi4.1.0 DEBUGT"
     - ssh fundy "\rm -rf $CI_PROJECT_DIR"

