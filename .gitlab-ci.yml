variables:
      GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/oasis3-mct

tests_toys_oasis_tioman:
     tags:
     - sshjonvilleci.spike
     only:        
     - master
               
     script:
     - ssh tioman "\rm -rf ${SCRATCHDIR}/oasis3-mct ${SCRATCHDIR}/OA3_MCT_RES ; mkdir ${SCRATCHDIR}/OA3_MCT_RES"
     - ssh tioman "git clone git@nitrox.cerfacs.fr:globc/OASIS3-MCT/oasis3-mct.git ${SCRATCHDIR}/."
     - ssh tioman "${SCRATCHDIR}/oasis3-mct/util/nitrox/sc_lc_nitrox.sh tioman_intel21.1.1_intelmpi2021.1.1 DEBUGT"
     - ssh tioman "\rm -rf ${HOME}/builds"
