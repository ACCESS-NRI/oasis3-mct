     - ssh stiff "rm -rf /space/coquart/OA3_MCT_RES ; mkdir /space/coquart/OA3_MCT_RES"
     - ssh stiff "cd $CI_PROJECT_DIR/util/nitrox;./sc_lc_nitrox.sh stiff_pgi20.4_openmpi3.1.3 DEBUGT $CI_PROJECT_DIR" 

