tests_toys_oasis_kraken:
     tags:
     - sshcoquartci.spike
     only:
     - new_header_Makefiles_final

     script:
     - ssh kraken "rm -rf /scratch/globc/coquart/OA3_MCT_RES ; mkdir /scratch/globc/coquart/OA3_MCT_RES"
     - ssh kraken "rm -rf /scratch/globc/coquart/oasis3-mct"
     - ssh kraken "cd /scratch/globc/coquart; git clone -b new_header_Makefiles_final git@nitrox.cerfacs.fr:globc/OASIS3-MCT/oasis3-mct.git"
     - ssh kraken "cd /scratch/globc/coquart/oasis3-mct/util/nitrox;./sc_lc_nitrox_kraken.sh kraken_intel18.0.1.163_intelmpi2018.1.163 DEBUGT"

tests_toys_oasis_belenos:
     tags:
     - sshcoquartci.spike
     only:
     - new_header_Makefiles_final

     script:
     - ssh elnino "/home/globc/coquart/bin/nitrox_belenos_oas3mct_run belenos_intel2018.5.274_intelmpi2018.5.274 DEBUGF" 
